name: Deploy

# Deploys to AWS (ECR + ECS Fargate) after CI passes on main.
# It stays switched off until you add the repository variables listed in the README
# (Settings -> Secrets and variables -> Actions -> Variables), so a fresh fork never fails.
#
# Authentication uses GitHub OIDC: no AWS access keys are stored in GitHub.

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write # lets the job request an OIDC token for AWS
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel a deploy half-way

jobs:
  deploy:
    name: Build, push and deploy to ECS
    runs-on: ubuntu-latest
    environment: production
    if: >-
      vars.AWS_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
      CONTAINER_NAME: shop
    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_run this is the commit that CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker build --build-arg APP_VERSION="$TAG" -t "$REGISTRY/$ECR_REPOSITORY:$TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          echo "image=$REGISTRY/$ECR_REPOSITORY:$TAG" >> "$GITHUB_OUTPUT"

      - name: Download the current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Put the new image into the task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image }}

      - name: Deploy to ECS and wait until it is stable
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Post-deploy health check
    run: bash scripts/check_health.sh http://localhost:3000 15 2
